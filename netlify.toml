[build]
  # npm run build = next build + postbuild (shrinks the generated OG images)
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Next's static export writes generated Open Graph images without a file
# extension (e.g. /opengraph-image, /blog/<slug>/opengraph-image), so tell
# browsers and social crawlers they're PNGs.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/*/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
